name: Сборка готового APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода проекта
        uses: actions/checkout@v4

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: Установка Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Подготовка ключей отладки (.env и debug.keystore)
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Сборка файла app-debug.apk
        run: gradle assembleDebug --no-daemon

      - name: Готовый APK для скачивания на телефон
        uses: actions/upload-artifact@v4
        with:
          name: Gotoviy-APK-Schetchik-Trafika
          path: app/build/outputs/apk/debug/app-debug.apk
